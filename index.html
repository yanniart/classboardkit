<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="Offline-first classroom widget board. No sign-up, no server." />
    <meta name="color-scheme" content="light dark" />
    <title>ClassBoardKit</title>
    <meta name="theme-color" content="#2f6fdc" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/app.css" />
    <link rel="stylesheet" href="src/styles/widgets.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <button type="button" class="skip-link" id="skip-to-dock" data-i18n="a11y.skipToDock"></button>
      <section class="toolbar toolbar--start" data-i18n-aria-label="toolbar.board">
        <h1 class="sr-only" data-i18n="app.name">ClassBoardKit</h1>
        <details class="popover" id="board-menu">
          <summary class="chip chip--button" data-i18n-title="board.menu">
            <span class="chip__text" id="board-name"></span>
            <svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons.svg#chevron-down"></use></svg>
          </summary>
          <div class="popover__panel popover__panel--start board-menu">
            <p class="popover__heading" data-i18n="board.menu"></p>
            <ul class="board-menu__list" id="board-list"></ul>
            <div class="board-menu__actions" id="board-actions">
              <button type="button" class="menu-button" data-action="new">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg>
                <span data-i18n="board.new"></span>
              </button>
              <button type="button" class="menu-button" data-action="template">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#template"></use></svg>
                <span data-i18n="template.menu"></span>
              </button>
              <button type="button" class="menu-button" data-action="rename">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#pencil"></use></svg>
                <span data-i18n="board.rename"></span>
              </button>
              <button type="button" class="menu-button" data-action="duplicate">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#copy"></use></svg>
                <span data-i18n="board.duplicate"></span>
              </button>
              <button type="button" class="menu-button menu-button--danger" data-action="delete">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#trash"></use></svg>
                <span data-i18n="board.delete"></span>
              </button>
            </div>
            <p class="popover__heading" data-i18n="board.background"></p>
            <div class="swatches" id="background-swatches"></div>
            <input type="file" id="background-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
            <p class="popover__heading" data-i18n="widgetStyle.heading"></p>
            <div class="widget-style" id="widget-style"></div>
            <p class="popover__heading" data-i18n="board.backupHeading"></p>
            <div class="board-menu__actions board-menu__actions--transfer" id="board-transfer">
              <button type="button" class="menu-button" data-action="export">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#download"></use></svg>
                <span data-i18n="board.export"></span>
              </button>
              <button type="button" class="menu-button" data-action="exportAll">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#download"></use></svg>
                <span data-i18n="board.exportAll"></span>
              </button>
              <button type="button" class="menu-button" data-action="share">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#share"></use></svg>
                <span data-i18n="share.menu"></span>
              </button>
              <button type="button" class="menu-button" data-action="import">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#upload"></use></svg>
                <span data-i18n="board.import"></span>
              </button>
            </div>
            <p class="board-menu__backup" id="board-backup-status"></p>
            <input type="file" id="import-file" accept=".json,application/json" hidden />
          </div>
        </details>
        <button type="button" class="icon-button" id="undo-button" disabled>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#undo"></use></svg>
        </button>
        <button type="button" class="icon-button" id="redo-button" disabled>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#redo"></use></svg>
        </button>
      </section>

      <section class="toolbar toolbar--end" data-i18n-aria-label="toolbar.display">
        <button type="button" class="icon-button" id="keep-awake-toggle" aria-pressed="false" hidden>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sun"></use></svg>
        </button>
        <button type="button" class="icon-button" id="fullscreen-toggle" aria-pressed="false" hidden>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#maximize"></use></svg>
        </button>
        <details class="popover" id="settings">
          <summary class="icon-button" data-i18n-aria-label="settings.open" data-i18n-title="settings.open">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sliders"></use></svg>
          </summary>
          <div class="popover__panel">
            <label class="field">
              <span class="field__label" data-i18n="settings.language"></span>
              <select class="field__control" id="setting-locale"></select>
            </label>
            <a class="field__hint-link" id="translation-help" href="https://github.com/yanniart/classboardkit/issues/new?template=translation.md" target="_blank" rel="noopener" data-i18n="settings.translationHelp"></a>
            <label class="field">
              <span class="field__label" data-i18n="settings.theme"></span>
              <select class="field__control" id="setting-theme"></select>
            </label>
            <button type="button" class="menu-button" id="shortcuts-open">
              <span data-i18n="shortcuts.open"></span>
            </button>
          </div>
        </details>
      </section>

      <main class="canvas" id="canvas" tabindex="-1" data-i18n-aria-label="board.canvasLabel">
        <div class="canvas__empty" id="canvas-empty">
          <svg class="icon icon--xl" aria-hidden="true"><use href="assets/icons.svg#board"></use></svg>
          <p class="canvas__empty-title" data-i18n="board.empty.title"></p>
          <p class="canvas__empty-body" data-i18n="board.empty.body"></p>
          <button type="button" class="canvas__empty-action" id="empty-template">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#template"></use></svg>
            <span data-i18n="template.emptyLink"></span>
          </button>
        </div>
      </main>

      <nav class="dock" id="dock" data-i18n-aria-label="dock.label"></nav>

      <div class="notices" id="notices" role="status" aria-live="polite"></div>
    </div>

    <noscript>
      <p class="noscript">ClassBoardKit needs JavaScript to run.</p>
    </noscript>
  </body>
</html>
